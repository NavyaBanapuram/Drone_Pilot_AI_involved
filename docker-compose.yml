version: "3.8"

services:
  drone-pilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: drone-pilot:latest
    container_name: drone-pilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
